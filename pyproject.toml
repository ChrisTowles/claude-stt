[project]
name = "claude-stt"
version = "0.2.0"
description = "Local speech-to-text input for Claude Code with live streaming dictation (NVIDIA Parakeet)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Jarrod Watts", email = "jarrod@jarrodwatts.com" }
]
keywords = ["claude", "speech-to-text", "stt", "voice", "dictation", "parakeet", "nemo", "mlx"]

dependencies = [
    "pynput>=1.7",
    "pyperclip>=1.8",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "sounddevice>=0.4",
    "huggingface-hub>=0.24",
    # NeMo (Linux/Windows) needs numpy<2; parakeet-mlx (macOS) needs numpy>=2.2.5.
    "numpy<2 ; sys_platform != 'darwin'",
    "numpy>=2.2.5 ; sys_platform == 'darwin'",
    # Linux/Windows: NeMo + CUDA Parakeet
    "torch>=2.4 ; sys_platform != 'darwin'",
    "torchaudio>=2.4 ; sys_platform != 'darwin'",
    "nemo-toolkit[asr]>=2.0 ; sys_platform != 'darwin'",
    # macOS (Apple Silicon): Parakeet-MLX
    "parakeet-mlx>=0.5 ; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa ; sys_platform == 'darwin'",
    "pywin32 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
claude-stt = "claude_stt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_stt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]
