[project]
name = "claude-stt"
version = "0.1.0"
description = "Speech-to-text input for Claude Code with live streaming dictation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [
    { name = "Jarrod Watts", email = "jarrod@jarrodwatts.com" }
]
keywords = ["claude", "speech-to-text", "stt", "voice", "dictation"]

dependencies = [
    "aiohttp>=3.9",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "pytest",
    "ruff",
    "httpx",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa"]
windows = ["pywin32"]

[project.scripts]
claude-stt = "claude_stt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_stt"]

[tool.ruff]
line-length = 100
target-version = "py310"
