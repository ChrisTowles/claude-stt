# keyd snippet for claude-stt
#
# Remaps Caps Lock to a direct SIGUSR1 against the running claude-stt
# daemon, bypassing the compositor entirely. We previously routed
# Caps Lock → Ctrl+Alt+F13 → COSMIC custom shortcut, but COSMIC's
# custom-shortcut dispatch for F13–F24 doesn't fire reliably.
#
# pkill -f matches the daemon's cmdline ("python -m claude_stt.daemon run").
# keyd runs as root, so the signal succeeds regardless of the daemon's user.
#
# Install (fresh keyd setup with no existing config):
#
#     sudo install -m 0644 configs/keyd/claude-stt.conf /etc/keyd/default.conf
#     sudo systemctl restart keyd
#
# Install (merge into an existing /etc/keyd/default.conf):
#
#     Add the following line under the [main] section of the existing file:
#
#         capslock = command(/usr/bin/pkill -USR1 -f 'claude_stt.daemon run')
#
#     Then: sudo systemctl restart keyd
#
# Verify with `sudo keyd monitor` — pressing Caps Lock should show no key
# event at all on the virtual keyboard (it's consumed by the command action),
# and the claude-stt daemon log should show "SIGUSR1: starting recording".

[ids]

*

[main]

capslock = command(/usr/bin/pkill -USR1 -f 'claude_stt.daemon run')
